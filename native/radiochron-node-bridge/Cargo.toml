[package]
name = "radiochron-node-bridge"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
blazingly-json = "0.1.0"
radiochron = { git = "https://github.com/sergii-ziborov/radiochron", rev = "83865e2", default-features = false, features = ["status", "scan", "analyze", "sample", "history", "record", "connectivity", "ble", "incident"] }
radiochron-native-ble = "0.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration"] }

[patch.crates-io]
radiochron = { git = "https://github.com/sergii-ziborov/radiochron", rev = "83865e2" }

[profile.release]
lto = "thin"
strip = true
