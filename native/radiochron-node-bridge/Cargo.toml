[package]
name = "radiochron-node-bridge"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
blazingly-json = "0.1.0"
radiochron = { version = "=0.6.0", default-features = false, features = ["status", "scan", "analyze", "sample", "history", "record", "connectivity", "ble", "incident"] }
radiochron-native-ble = { git = "https://github.com/sergii-ziborov/radiochron-native-ble", rev = "8e5baba" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration"] }

[profile.release]
lto = "thin"
strip = true
